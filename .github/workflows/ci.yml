name: CI

# Builds only run on pull requests. Direct pushes to main no longer trigger
# a Tauri build — production installers are cut by the Build and Release
# workflow (release.yml), which is triggered by pushing a v* tag or by
# creating a GitHub Release from the Releases page.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
          - platform: 'windows-latest'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Russian PTO module and lint
        run: |
          npm test
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Build Tauri app
        run: npm run tauri build -- --no-bundle

  browser-mvp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Russian AOSR browser smoke test
        run: npm run test:e2e
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pto-e2e-failures
          path: test-results/
          if-no-files-found: ignore
